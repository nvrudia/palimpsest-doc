[project]
name = "palimpsest-doc"
version = "0.1.0.dev0"
description = "Detect divergence between what a human reads and what a pipeline ingests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [{ name = "Mykola Rudia", email = "t.techukr@gmail.com" }]
keywords = ["pdf", "docx", "document-integrity", "forensics", "prompt-injection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Text Processing",
]
# The extraction layer subclasses pdfminer's PDFLayoutAnalyzer and relies on
# the render_string/render_char call chain, and on LTChar instances being
# appended to `cur_item._objs`. None of that is public API, so the lower bound
# is pinned to the version this was verified against rather than to a guess.
#
# pypdfium2 is a runtime dependency, not a test one: rendering is a second,
# independent reading of the document, and the tool relies on it while it works.
# It has to be a different implementation, not merely a convenient one. It wraps
# PDFium, which shares no code with pdfminer, so agreement between the two is
# evidence. A single parser agreeing with itself is not.
#
# Licensing: the wrapper is BSD/Apache, PDFium is BSD. Both are compatible with
# EUPL-1.2. Pillow arrives transitively and is used to read the raster.
dependencies = [
    "pdfminer.six>=20260107",
    "pypdfium2>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "reportlab>=4"]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[project.urls]
Repository = "https://github.com/nvrudia/palimpsest-doc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The reproduction scripts stand outside the package: they import pdfplumber, which was
# deliberately left out of the dependencies, so a type check could only pass by declaring an
# override for a library the tool never loads. Excluding the directory keeps that admission out
# of the configuration. This entry has to precede the overrides below, as TOML will not accept
# [tool.mypy] after [[tool.mypy.overrides]] has already opened the table.
[tool.mypy]
exclude = ["^reproduction/"]

# reportlab ships no type information and no stub package is available in our
# dependency set, so importing it fails the check with import-untyped. Scoped to
# reportlab alone, and only reached from the test fixtures: an untyped import
# anywhere else, including pdfminer, still fails as it should.
[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

# pypdfium2 ships no py.typed marker either. The exemption is narrower than it
# looks: the rendering layer touches this library in one module and converts its
# results to plain tuples and bytes at the boundary, so nothing untyped travels
# further into the package.
[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true
