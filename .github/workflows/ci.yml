name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  # The suite above cannot catch a runtime dependency that is missing from the
  # metadata, because it runs in the environment that supplies it. Twice now a
  # library has been reached at runtime while being installed only as somebody
  # else's dependency: pdfplumber, and then Pillow, which arrives with reportlab
  # and would have vanished with it. This job installs what a user installs, and
  # scans a document without pytest, ruff or reportlab present.
  runtime-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install without the dev extra
        run: uv sync

      - name: Import the package
        run: uv run python -c "import palimpsest.cli, palimpsest.integrity.render"

      - name: Scan a document
        run: |
          uv run python - <<'PY'
          import subprocess, sys

          # Written by hand rather than with reportlab, which is exactly the kind
          # of dependency this job exists to do without. One visible line and one
          # in render mode 3, so the scan has something to find.
          stream = b"""BT /F1 12 Tf 72 720 Td (VISIBLE LINE) Tj ET
          q BT /F1 12 Tf 3 Tr 72 700 Td (HIDDEN MARKER) Tj ET Q"""
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792]"
              b" /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
              b"<< /Length %d >>\nstream\n%s\nendstream" % (len(stream), stream),
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          out = bytearray(b"%PDF-1.4\n")
          offsets = []
          for number, body in enumerate(objects, start=1):
              offsets.append(len(out))
              out += b"%d 0 obj\n%s\nendobj\n" % (number, body)
          start = len(out)
          out += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objects) + 1)
          for offset in offsets:
              out += b"%010d 00000 n \n" % offset
          out += b"trailer\n<< /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (
              len(objects) + 1,
              start,
          )
          open("sample.pdf", "wb").write(bytes(out))

          result = subprocess.run(
              [sys.executable, "-m", "palimpsest", "scan", "sample.pdf"],
              capture_output=True,
              text=True,
          )
          print(result.stdout, result.stderr)
          # 1 means the file was read, the analysis finished and findings exist.
          # 2 would mean the tool could not do its job, which is the failure this
          # job is looking for.
          if result.returncode != 1:
              sys.exit(f"expected exit code 1, got {result.returncode}")
          PY
